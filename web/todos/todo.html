<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo List</title>
  <link rel="stylesheet" href="../assets/css/todo.css" />
  <link rel="stylesheet" href="../assets/css/footer.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="icon" type="image/png" href="../assets/img/logo.png" />
</head>
<body>
    <div class="header">
        <img src="../assets/img/logo.png" alt="Epytodo Logo" class="logo">
        <div class="nav-center">
            <a href="../index.html"><i class="fa-solid fa-house"></i> Home</a>
            <a href="#"><i class="fa-solid fa-calendar-check"></i> Todos</a>
        </div>
        <div class="login">
            <a href="../auth/logout.html">Logout <i class="fa-solid fa-arrow-right-to-bracket"></i></a>
        </div>
    </div>

  <div class="container">

    <div class="page-heading">
      <h1>To-Do List</h1>
      <p>Make your to-do task easily.</p>
    </div>

    <div class="card form-card">
      <h2 class="card-title">New task</h2>

      <div class="form-group">
        <label for="todoName">Task name <span class="req">*</span></label>
        <input type="text" id="todoName" placeholder="Ex : prepare the keynote…" />
      </div>

      <div class="form-group">
        <label>Status</label>
        <div class="status-options">
          <label class="status-option" data-status="not-started">
            <input type="radio" name="status" value="not-started" checked />
            <span class="pill pill-not-started">Not started</span>
          </label>
          <label class="status-option" data-status="todo">
            <input type="radio" name="status" value="todo" />
            <span class="pill pill-todo">Todo</span>
          </label>
          <label class="status-option" data-status="in-progress">
            <input type="radio" name="status" value="in-progress" />
            <span class="pill pill-in-progress">In progress</span>
          </label>
          <label class="status-option" data-status="done">
            <input type="radio" name="status" value="done" />
            <span class="pill pill-done">Done</span>
          </label>
        </div>
      </div>

      <div class="form-group">
        <label for="todoDesc">Description</label>
        <textarea id="todoDesc" placeholder="Make a good presentation on powerpoint.." rows="3"></textarea>
      </div>

      <div class="form-group">
        <label for="todoDue">Due Time</label>
        <input type="datetime-local" id="todoDue" />
      </div>

      <button class="btn btn-primary" id="addBtn">+ Add task</button>
    </div>

    <div class="filters" id="filters">
      <button class="filter-btn active" data-filter="my">My task</button>
      <button class="filter-btn" data-filter="all-tasks">All task</button>
      <button class="filter-btn" data-filter="not-started">Not started</button>
      <button class="filter-btn" data-filter="todo">Todo</button>
      <button class="filter-btn" data-filter="in-progress">In progress</button>
      <button class="filter-btn" data-filter="done">Done</button>
    </div>

    <div id="todoList" class="todo-list"></div>

  </div>
      <footer class="site-footer">
      <div class="site-footer__top">
        <div class="site-footer__newsletter">
          <label class="site-footer__newsletter-label" for="footerEmail">Enter your email</label>
          <div class="site-footer__newsletter-field">
            <input id="footerEmail" type="email" placeholder="Enter your email" />
            <button type="button" class="site-footer__newsletter-button" aria-label="Send email">
              <i class="fa-solid fa-arrow-right"></i>
            </button>
          </div>
        </div>

        <nav class="site-footer__links" aria-label="Footer links">
          <a href="../index.html#sec2">Features</a>
          <a href="../index.html#sec2">Blog</a>
          <a href="../index.html#sec2">Pricing</a>
          <a href="../index.html#sec2">Services</a>
        </nav>

        <div class="site-footer__socials" aria-label="Social links">
          <a href="https://twitter.com" target="_blank" rel="noreferrer" aria-label="Twitter"><i class="fa-brands fa-twitter"></i></a>
          <a href="https://instagram.com" target="_blank" rel="noreferrer" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
          <a href="https://facebook.com" target="_blank" rel="noreferrer" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
          <a href="https://pinterest.com" target="_blank" rel="noreferrer" aria-label="Pinterest"><i class="fa-brands fa-pinterest-p"></i></a>
        </div>
      </div>

      <div class="site-footer__middle">
        <nav class="site-footer__legal" aria-label="Legal links">
          <a href="#">Terms</a>
          <a href="#">About</a>
          <a href="#">Privacy</a>
          <a href="#">Contact</a>
        </nav>

        <div class="site-footer__brand">
          <img src="../assets/img/logo.png" alt="Epytodo logo" class="site-footer__brand-logo" />
          <span>Epytodo</span>
        </div>

        <p class="site-footer__copy">© 2026. All Rights Reserved.</p>
      </div>
      </footer>
  
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/todo.js"></script>
</body>
</html>
